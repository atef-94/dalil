services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: active_os
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: active_os
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    environment:
      NODE_ENV: production
      PORT: 3000
      TOKEN_SECRET: ${TOKEN_SECRET}
      DATABASE_URL: postgres://active_os:${POSTGRES_PASSWORD:-change-me}@db:5432/active_os
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    ports:
      - '3000:3000'

volumes:
  db-data:
